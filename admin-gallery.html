<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Galeri | Baraka Express</title>
<style>
:root{font-family:system-ui,sans-serif;color:#12303b;background:#edf5f7}*{box-sizing:border-box}body{margin:0;padding:24px}.panel{max-width:900px;margin:32px auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 12px 36px #0b506822}h1{margin:0 0 8px;color:#08566a}p{color:#5d7480}.row{display:grid;grid-template-columns:1.2fr 1fr 1.2fr auto;gap:10px;margin:14px 0;align-items:center}input{width:100%;padding:11px;border:1px solid #c8d8de;border-radius:9px}input[type=file]{font-size:12px;padding:8px}button{border:0;border-radius:9px;padding:11px 14px;background:#0b6c83;color:white;font-weight:700;cursor:pointer}button.remove{background:#a43e48}button.upload{white-space:nowrap}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.field{display:block;margin:12px 0}.field input{max-width:460px}.hint{font-size:13px}.status{min-height:24px;margin-top:14px}@media(max-width:700px){body{padding:12px}.panel{padding:20px}.row{grid-template-columns:1fr}.row button{justify-self:start}}
</style>
</head>
<body><main class="panel"><h1>Kelola Gallery</h1><p>Login untuk mengatur slide dan mengunggah gambar langsung dari komputer.</p>
<section id="login"><label class="field">ID admin<br><input id="adminId" autocomplete="username"></label><label class="field">Password<br><input id="adminPassword" type="password" autocomplete="current-password"></label><button id="loginButton" type="button">Login</button></section>
<section id="editor" hidden><div id="rows"></div><div class="actions"><button id="add" type="button">Tambah gambar</button><button id="save" type="button">Simpan perubahan</button><button id="logout" type="button">Keluar</button></div><p class="hint">Format upload: JPG, PNG, WebP, maksimal 500 MB per gambar. Sesi login berlaku 30 menit.</p></section>
<div class="status" id="status" role="status"></div></main>
<script>
const API="https://digitalmarketing.iamhere-devone.workers.dev/?resource=gallery",rows=document.getElementById("rows"),status=document.getElementById("status");let slides=[],session="";
function draw(){rows.replaceChildren();slides.forEach((item,i)=>{const row=document.createElement("div");row.className="row";const path=document.createElement("input");path.placeholder="Path gambar atau URL hasil upload";path.value=item.path||"";path.setAttribute("aria-label",`Path gambar ${i+1}`);path.oninput=()=>item.path=path.value;const alt=document.createElement("input");alt.placeholder="Teks alt";alt.value=item.alt||"";alt.setAttribute("aria-label",`Teks alt ${i+1}`);alt.oninput=()=>item.alt=alt.value;const picker=document.createElement("input");picker.type="file";picker.accept="image/jpeg,image/png,image/webp";picker.setAttribute("aria-label",`Pilih file gambar ${i+1}`);const upload=document.createElement("button");upload.className="upload";upload.type="button";upload.textContent="Upload";upload.onclick=()=>uploadImage(picker.files[0],item,upload);const remove=document.createElement("button");remove.className="remove";remove.type="button";remove.textContent="Hapus";remove.onclick=()=>{slides.splice(i,1);draw()};const fileGroup=document.createElement("div");fileGroup.append(picker,upload);row.append(path,alt,fileGroup,remove);rows.append(row)})}
async function uploadImage(file,item,button){if(!file)return status.textContent="Pilih file gambar terlebih dahulu.";if(file.size>500*1024*1024)return status.textContent="Ukuran maksimal 500 MB.";button.disabled=true;status.textContent="Memulai upload...";let uploadId="";try{const initResponse=await fetch(API+"&action=upload-init",{method:"POST",headers:{"Content-Type":"application/json","X-Admin-Session":session},body:JSON.stringify({type:file.type,size:file.size})}),initData=await initResponse.json();if(!initResponse.ok)throw Error(initData.error||`HTTP ${initResponse.status}`);uploadId=initData.uploadId;const chunkSize=initData.chunkSize;let partNumber=1;for(let start=0;start<file.size;start+=chunkSize,partNumber++){const bytes=new Uint8Array(await file.slice(start,Math.min(start+chunkSize,file.size)).arrayBuffer());let binary="";for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));const response=await fetch(API+"&action=upload-part",{method:"POST",headers:{"Content-Type":"application/json","X-Admin-Session":session},body:JSON.stringify({uploadId,partNumber,data:btoa(binary)})}),data=await response.json();if(!response.ok)throw Error(data.error||`HTTP ${response.status}`);status.textContent=`Upload ${Math.min(100,Math.round((start+bytes.length)/file.size*100))}%`};const completeResponse=await fetch(API+"&action=upload-complete",{method:"POST",headers:{"Content-Type":"application/json","X-Admin-Session":session},body:JSON.stringify({uploadId})}),completeData=await completeResponse.json();if(!completeResponse.ok)throw Error(completeData.error||`HTTP ${completeResponse.status}`);item.path=completeData.path;draw();status.textContent="Upload berhasil. Klik Simpan perubahan untuk menambahkannya ke carousel."}catch(error){status.textContent="Upload gagal: "+error.message}finally{button.disabled=false}}async function load(){const response=await fetch(API);if(!response.ok)throw Error(`HTTP ${response.status}`);slides=(await response.json()).slides||[];draw()}
document.getElementById("loginButton").onclick=async()=>{status.textContent="Memeriksa login…";try{const response=await fetch(API+"&action=login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:document.getElementById("adminId").value,password:document.getElementById("adminPassword").value})}),data=await response.json();if(!response.ok)throw Error(data.error||"Login gagal");session=data.session;await load();document.getElementById("adminPassword").value="";document.getElementById("login").hidden=true;document.getElementById("editor").hidden=false;status.textContent="Login berhasil."}catch(error){status.textContent=error.message}};
document.getElementById("add").onclick=()=>{slides.push({path:"",alt:""});draw()};document.getElementById("save").onclick=async()=>{if(slides.some(item=>!item.path.trim()))return status.textContent="Semua path harus diisi.";status.textContent="Menyimpan daftar gallery…";try{const response=await fetch(API,{method:"PUT",headers:{"Content-Type":"application/json","X-Admin-Session":session},body:JSON.stringify({slides})}),data=await response.json();if(!response.ok)throw Error(data.error||`HTTP ${response.status}`);status.textContent=`Tersimpan: ${data.slides} gambar.`}catch(error){session="";document.getElementById("login").hidden=false;document.getElementById("editor").hidden=true;status.textContent=error.message}};
document.getElementById("logout").onclick=()=>{session="";slides=[];document.getElementById("login").hidden=false;document.getElementById("editor").hidden=true;status.textContent="Anda sudah keluar."};
</script></body></html>
