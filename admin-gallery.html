<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Galeri | Baraka Express</title><style>
:root{font-family:system-ui,sans-serif;color:#12303b;background:#edf5f7}*{box-sizing:border-box}body{margin:0;padding:24px}.panel{max-width:780px;margin:32px auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 12px 36px #0b506822}h1{margin:0 0 8px;color:#08566a}p{color:#5d7480}.row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin:12px 0}input{width:100%;padding:12px;border:1px solid #c8d8de;border-radius:9px}button{border:0;border-radius:9px;padding:12px 16px;background:#0b6c83;color:white;font-weight:700;cursor:pointer}button.remove{background:#a43e48}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.field{display:block;margin:12px 0}.field input{max-width:460px}.hint{font-size:13px}.status{min-height:24px;margin-top:14px}@media(max-width:600px){body{padding:12px}.panel{padding:20px}.row{grid-template-columns:1fr}.row button{justify-self:start}}
</style></head><body><main class="panel"><h1>Kelola Gallery</h1><p>Login untuk mengatur urutan slide dan path gambar di folder <code>assets/</code>.</p>
<section id="login"><label class="field">ID admin<br><input id="adminId" autocomplete="username"></label><label class="field">Password<br><input id="adminPassword" type="password" autocomplete="current-password"></label><button id="loginButton" type="button">Login</button></section>
<section id="editor" hidden><div id="rows"></div><div class="actions"><button id="add" type="button">Tambah gambar</button><button id="save" type="button">Simpan perubahan</button><button id="logout" type="button">Keluar</button></div><p class="hint">Path contoh: <code>assets/Cabang Pekanbaru Utara WEB.png</code>. Sesi login berakhir dalam 30 menit.</p></section>
<div class="status" id="status" role="status"></div></main><script>
const API="https://digitalmarketing.iamhere-devone.workers.dev/?resource=gallery",rows=document.getElementById("rows"),status=document.getElementById("status");let slides=[],session="";
function draw(){rows.replaceChildren();slides.forEach((x,i)=>{const r=document.createElement("div");r.className="row";const p=document.createElement("input");p.placeholder="Path gambar";p.value=x.path||"";p.setAttribute("aria-label",`Path gambar ${i+1}`);p.oninput=()=>x.path=p.value;const a=document.createElement("input");a.placeholder="Teks alt";a.value=x.alt||"";a.setAttribute("aria-label",`Teks alt ${i+1}`);a.oninput=()=>x.alt=a.value;const b=document.createElement("button");b.type="button";b.className="remove";b.textContent="Hapus";b.onclick=()=>{slides.splice(i,1);draw()};r.append(p,a,b);rows.append(r)})}
async function load(){const r=await fetch(API);if(!r.ok)throw Error(`HTTP ${r.status}`);slides=(await r.json()).slides||[];draw()}
document.getElementById("loginButton").onclick=async()=>{status.textContent="Memeriksa login…";try{const r=await fetch(API+"&action=login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:document.getElementById("adminId").value,password:document.getElementById("adminPassword").value})}),d=await r.json();if(!r.ok)throw Error(d.error||"Login gagal");session=d.session;await load();document.getElementById("adminPassword").value="";document.getElementById("login").hidden=true;document.getElementById("editor").hidden=false;status.textContent="Login berhasil."}catch(e){status.textContent=e.message}};
document.getElementById("add").onclick=()=>{slides.push({path:"",alt:""});draw()};document.getElementById("save").onclick=async()=>{if(slides.some(x=>!x.path.trim()))return status.textContent="Semua path harus diisi.";status.textContent="Menyimpan…";try{const r=await fetch(API,{method:"PUT",headers:{"Content-Type":"application/json","X-Admin-Session":session},body:JSON.stringify({slides})}),d=await r.json();if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);status.textContent=`Tersimpan: ${d.slides} gambar.`}catch(e){session="";document.getElementById("login").hidden=false;document.getElementById("editor").hidden=true;status.textContent=e.message}};
document.getElementById("logout").onclick=()=>{session="";slides=[];document.getElementById("login").hidden=false;document.getElementById("editor").hidden=true;status.textContent="Anda sudah keluar."};
</script></body></html>
