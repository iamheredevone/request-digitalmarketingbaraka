<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#003462">
  <meta name="description" content="Kelola gambar carousel Baraka Express.">
  <title>Admin Galeri | Baraka Express</title>
  <link rel="stylesheet" href="admin-gallery.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="bubbles">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

  <main class="panel" id="panel">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="3"></rect>
          <circle cx="9" cy="10" r="1.8"></circle>
          <path d="m21 16-5-5-8 9"></path>
        </svg>
      </div>
    </div>
    <h1 id="title">Kelola Gallery</h1>
    <p class="sub" id="sub">Login untuk mengatur slide dan mengunggah gambar langsung dari komputer.</p>

    <section id="login" aria-label="Login admin galeri">
      <div class="field">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path>
        </svg>
        <input id="adminId" placeholder=" " autocomplete="username" aria-label="ID admin">
        <label for="adminId">ID admin</label>
      </div>
      <div class="field">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="11" width="16" height="10" rx="2.5"></rect>
          <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
        </svg>
        <input id="adminPassword" type="password" placeholder=" " autocomplete="current-password" aria-label="Password">
        <label for="adminPassword">Password</label>
        <button class="eye" id="togglePw" type="button" aria-label="Tampilkan password">
          <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 3l18 18M10.6 5.1A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4M6.5 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7c1.7 0 3.2-.4 4.5-1M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
          </svg>
        </button>
      </div>
      <button id="loginButton" type="button">
        <span class="spinner" aria-hidden="true"></span>
        <span class="label-text">Login</span>
      </button>
      <p class="secure">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3 4 6v6c0 4.5 3.2 8 8 9 4.8-1 8-4.5 8-9V6l-8-3Z"></path>
        </svg>
        Area khusus admin &middot; sesi berlaku 30 menit
      </p>
    </section>

    <section id="editor" aria-label="Editor galeri" hidden>
      <a class="editor-shortcut" href="./admin-site-editor.html" target="_blank" rel="noopener noreferrer">Buka Editor Website <span aria-hidden="true">↗</span></a>
      <div id="rows"></div>
      <div class="actions">
        <button id="add" type="button">Tambah gambar</button>
        <button id="save" type="button">Simpan perubahan</button>
        <button id="logout" type="button">Keluar</button>
      </div>
      <p class="hint">Format upload: JPG, PNG, WebP, maksimal 500 MB per gambar. Sesi login berlaku 30 menit.</p>
    </section>

    <div class="status" id="status" role="status" aria-live="polite"></div>
  </main>

  <script src="admin-gallery.js"></script>
</body>
</html>
